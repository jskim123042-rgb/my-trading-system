version: "3.8"

services:
  agent:
    build: .
    container_name: bitget-agent
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    # 헬스체크: 로그 파일 최근 갱신 확인
    healthcheck:
      test: ["CMD-SHELL", "find /app/logs/trading.log -mmin -5 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
